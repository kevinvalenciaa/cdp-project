[project]
name = "lift-stats"
version = "0.1.0"
description = "Stats Verifier MCP — STL seasonal decomposition, two-proportion tests, CUPED holdout uplift, power analysis."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stats-server = "stats_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stats_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
